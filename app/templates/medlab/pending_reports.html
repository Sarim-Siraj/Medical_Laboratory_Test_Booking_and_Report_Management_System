{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h4 class="fw-bold mb-3">📄 Reports Awaiting Verification</h4>
    <table class="table table-bordered">
        <thead><tr><th>Report ID</th><th>Patient</th><th>Action</th></tr></thead>
        <tbody>
            {% for r in reports %}
            <tr>
                <td>#{{ r.id }}</td>
                <td><a href="{{ url_for('medlab.view_report', report_id=r.id) }}" class="btn btn-sm btn-outline-primary">View</a></td>
                <td>{{ r.booking.patient.full_name }} ({{ r.booking.patient.patient_code }})</td>
                <td>
                    <form method="POST" action="{{ url_for('medlab.verify_report', report_id=r.id) }}">
                        <button class="btn btn-sm btn-success">Verify</button>
                    </form>
                </td>
            </tr>
            {% else %}
            <tr><td colspan="3" class="text-center text-muted">No reports pending 🎉</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
