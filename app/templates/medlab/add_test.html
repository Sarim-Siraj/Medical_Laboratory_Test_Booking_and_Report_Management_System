{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h4 class="fw-bold mb-3">➕ Add New Test</h4>

    <form method="POST" style="max-width:500px;">
        <div class="mb-3">
            <label class="form-label">Category</label>
            <select name="category_id" class="form-select" required>
                {% for c in categories %}
                <option value="{{ c.id }}">{{ c.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Test Name</label>
            <input type="text" name="name" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Test Code</label>
            <input type="text" name="code" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Price (Rs.)</label>
            <input type="number" step="0.01" name="price" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Sample Type</label>
            <input type="text" name="sample_type" class="form-control" placeholder="e.g. Blood">
        </div>
        <div class="mb-3">
            <label class="form-label">Turnaround (hours)</label>
            <input type="number" name="turnaround_hours" class="form-control">
        </div>
        <button class="btn btn-primary">Add Test</button>
    </form>
</div>
{% endblock %}
