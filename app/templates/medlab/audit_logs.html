{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h4 class="fw-bold mb-3">🕵️ Audit Logs</h4>
    <table class="table table-bordered table-sm">
        <thead><tr><th>User ID</th><th>Action</th><th>Entity</th><th>Date</th></tr></thead>
        <tbody>
            {% for log in logs %}
            <tr>
                <td>{{ log.user_id }}</td>
                <td>{{ log.action }}</td>
                <td>{{ log.entity_type }} #{{ log.entity_id }}</td>
                <td>{{ log.created_at.strftime('%d %b %Y %H:%M') }}</td>
            </tr>
            {% else %}
            <tr><td colspan="4" class="text-center text-muted">No logs yet.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
