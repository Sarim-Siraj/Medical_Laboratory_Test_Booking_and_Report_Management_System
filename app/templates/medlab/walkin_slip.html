{% extends "base.html" %}

{% block content %}
<div class="container mt-4">

    <div class="card shadow-sm border-primary" style="max-width: 450px;">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Patient Registration Slip</h5>
        </div>
        <div class="card-body text-center">
            <p class="text-muted mb-1">Patient ID</p>
            <h2 class="fw-bold text-primary">{{ patient.patient_code }}</h2>
            <hr>
            <p><strong>Name:</strong> {{ patient.full_name }}</p>
            {% if patient.phone %}<p><strong>Phone:</strong> {{ patient.phone }}</p>{% endif %}
        </div>
    </div>

    <div class="mt-3">
        <a href="{{ url_for('medlab.register_walkin_patient') }}" class="btn btn-secondary">
            Register Another Patient
        </a>
        <a href="{{ url_for('medlab.book_test') }}" class="btn btn-primary">
            Book a Test Now
        </a>
    </div>

</div>
{% endblock %}
